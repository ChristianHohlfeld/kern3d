<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kern3d CDN</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e1116; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "kern3d": "https://cdn.jsdelivr.net/gh/ChristianHohlfeld/kern3d@0.1.1/dist/kern3d.module.js"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from "kern3d";

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0x0e1116);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(3, 2, 5);

    scene.add(new THREE.AmbientLight(0xffffff, 0.35));
    const sun = new THREE.DirectionalLight(0xffffff, 0.85);
    sun.position.set(4, 8, 2);
    scene.add(sun);

    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshPhongMaterial({ color: 0xe85d4c, shininess: 40 }),
    );
    scene.add(mesh);

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    function tick(now) {
      mesh.rotation.y = now * 0.001;
      mesh.rotation.x = now * 0.0004;
      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  </script>
</body>
</html>
